# Family HQ analysis is isolated from other home-lab scripts and documentation.
sonar.organization=msaperst
sonar.projectKey=msaperst_home-lab
sonar.projectName=Home Lab - Family HQ
sonar.sources=src
sonar.tests=tests
sonar.test.inclusions=tests/**/*.test.ts,tests/**/*.test.tsx
sonar.exclusions=dist/**,coverage/**,node_modules/**
# Entrypoints are verified by the container smoke test; shared/health.ts is type-only.
# All files remain included in Sonar static analysis.
sonar.coverage.exclusions=src/server/index.ts,src/client/main.tsx,src/shared/health.ts
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.sourceEncoding=UTF-8
