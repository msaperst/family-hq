# Update the EXISTING family-hq application in Container Station; do not create a second app.
# Replace BOTH image placeholders with the same verified full main-branch commit SHA.
# Keep the existing app's env_file, loopback port, and external SQLite volume.
services:
  family-hq:
    image: ghcr.io/msaperst/family-hq:sha-REPLACE_WITH_40_CHAR_COMMIT_SHA
    ports:
      - "127.0.0.1:3080:3080"
    env_file:
      - /share/Container/family-hq/.env.production
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      FAMILY_HQ_PORT: "3080"
      FAMILY_HQ_DB_PATH: /app/data/family-hq.sqlite
    volumes:
      - family-hq-data:/app/data
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3080/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # Two services, one Container Station application, shared private network.
  voice-agent:
    image: ghcr.io/msaperst/family-hq-voice-agent:sha-REPLACE_WITH_40_CHAR_COMMIT_SHA
    depends_on:
      family-hq:
        condition: service_healthy
        restart: true
    environment:
      IOT_ENDPOINT: a1zj6ia2bckpg1-ats.iot.us-east-1.amazonaws.com
      IOT_CLIENT_ID: family-hq-voice-agent
      IOT_CERT_PATH: /run/certs/device.pem.crt
      IOT_KEY_PATH: /run/certs/device.pem.key
      FAMILY_HQ_URL: http://family-hq:3080
    volumes:
      - /share/homes/msaperst/family-hq-voice/certs:/run/certs:ro
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=1m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  family-hq-data:
    external: true
    name: family-hq-data
