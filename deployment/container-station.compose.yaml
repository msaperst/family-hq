# Paste into Container Station > Applications > Create.
# Replace the image tag with a real successful main-branch SHA release.
# The absolute env_file must exist on the NAS before creating this application.
services:
  family-hq:
    image: ghcr.io/msaperst/family-hq:sha-REPLACE_WITH_40_CHAR_COMMIT_SHA
    ports:
      - "127.0.0.1:3080:3080"
    env_file:
      - /share/Container/family-hq/.env.production
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      FAMILY_HQ_PORT: "3080"
      FAMILY_HQ_DB_PATH: /app/data/family-hq.sqlite
    volumes:
      - family-hq-data:/app/data
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3080/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  family-hq-data:
    external: true
    name: family-hq-data
