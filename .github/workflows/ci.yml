name: Family HQ checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  app-checks:
    name: Typecheck, test, build and dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install locked dependencies
        run: npm ci --no-fund
      - name: Source hygiene and formatting
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Tests with coverage
        run: npm run test:coverage
      - name: Upload coverage for SonarQube
        uses: actions/upload-artifact@v4
        with:
          name: family-hq-coverage
          path: coverage/lcov.info
          if-no-files-found: error
      - name: Production build
        run: npm run build
      - name: Dependency audit
        run: npm audit --audit-level=high

  sqlite-backup-tests:
    name: SQLite backup and restore tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate backup/restore and release discovery utilities
        run: |
          python3 -m unittest discover -s tests -p 'test_family_hq_backup.py' -v
          python3 -m unittest discover -s tests -p 'test_release_discovery.py' -v

  browser-e2e:
    name: Playwright browser workflows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install locked app dependencies
        run: npm ci --no-fund
      - name: Install isolated Playwright test runner
        run: npm install --no-save --package-lock=false @playwright/test@1.56.1
      - name: Run browser tests in pinned Playwright container
        run: |
          docker run --rm --init --network host \
            -e HOME=/tmp -v "$PWD:/work" -w /work \
            mcr.microsoft.com/playwright:v1.56.1-noble \
            bash -lc 'npx playwright test'
      - name: Upload browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: family-hq-playwright-results
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore

  sonar:
    name: SonarQube analysis and quality gate
    needs: app-checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: family-hq-coverage
          path: coverage
      - name: Scan Family HQ
        uses: SonarSource/sonarqube-scan-action@v8
        with:
          projectBaseDir: .
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Enforce quality gate
        uses: SonarSource/sonarqube-quality-gate-action@v1.2.0
        with:
          scanMetadataReportFile: .scannerwork/report-task.txt
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  docker-smoke:
    name: Docker build and health smoke
    runs-on: ubuntu-latest
    env:
      FAMILY_HQ_PORT: '3080'
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t family-hq:ci .
      - name: Validate production Compose manifest
        run: sh scripts/check-production-compose.sh
      - name: Validate image-only Container Station manifest
        run: sh scripts/check-container-station-compose.sh
      - name: Start container
        run: docker run -d --name family-hq-ci -e FAMILY_HQ_PORT -p "127.0.0.1:${FAMILY_HQ_PORT}:${FAMILY_HQ_PORT}" family-hq:ci
      - name: Verify health
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent "http://127.0.0.1:${FAMILY_HQ_PORT}/api/health"; then
              exit 0
            fi
            sleep 1
          done
          docker logs family-hq-ci
          exit 1
      - name: Verify served frontend and missing API routes
        run: |
          set -eu
          curl --fail --silent "http://127.0.0.1:${FAMILY_HQ_PORT}/" | grep -q '<div id="root"></div>'
          status=$(curl --silent --output /dev/null --write-out '%{http_code}' "http://127.0.0.1:${FAMILY_HQ_PORT}/api/does-not-exist")
          test "$status" = 404
      - name: Stop container
        if: always()
        run: docker rm -f family-hq-ci || true
      - name: Verify SQLite persists through container recreation
        run: npm run test:e2e:persistence


  container-security:
    name: Container vulnerability scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Build production image
        run: docker build -t family-hq:ci .
      - name: Scan image for high and critical vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: family-hq:ci
          format: table
          exit-code: '1'
          severity: HIGH,CRITICAL
          vuln-type: os,library
          ignore-unfixed: true

  publish-image:
    name: Publish verified image to GHCR
    # Production images only originate from a fully validated main-branch commit.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [app-checks, browser-e2e, sonar, docker-smoke, container-security]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish immutable commit tag
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ghcr.io/${{ github.repository }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.description=Family HQ production image
          provenance: true
          sbom: true
