services:
  family-hq:
    build: .
    ports:
      - "127.0.0.1:${FAMILY_HQ_PORT:-3080}:${FAMILY_HQ_PORT:-3080}"
    environment:
      NODE_ENV: production
      FAMILY_HQ_PORT: "${FAMILY_HQ_PORT:-3080}"
      HOST: 0.0.0.0
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:' + process.env.FAMILY_HQ_PORT + '/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
